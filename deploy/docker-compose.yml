# Production stack for the VPS: the Settle container plus Caddy, which
# terminates TLS and fetches certificates automatically. Run from the repo
# root on the server: docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: settle:latest
    container_name: settle
    restart: unless-stopped
    # Lives outside the repo on the server, chmod 600. Adjust the path if you
    # keep it somewhere else.
    env_file:
      - /opt/settle.env
    # Only Caddy reaches the app over the compose network; nothing is
    # published to the host.
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    container_name: settle-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
